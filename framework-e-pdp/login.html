<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framework E — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Inter:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ Header ============ -->
<header class="site-header">
  <div class="container">
    <nav>
      <a href="#">Shop</a>
      <a href="#">About</a>
      <a href="#">Journal</a>
      <a href="#">Info</a>
      <a href="#">The Story</a>
    </nav>
    <a class="logo" href="index.html">BRAND</a>
    <nav>
      <a href="#">Search</a>
      <a href="login.html">Sign in</a>
      <a href="cart.html">Bag [0]</a>
    </nav>
  </div>
</header>

<main class="auth-main">
  <div class="auth-box">
    <h1 class="auth-title">로그인</h1>
    <div class="auth-content">
      <div class="field-list tight">
        <div class="field">
          <div class="text-field">
            <input type="email" id="loginEmail" placeholder="이메일 입력">
          </div>
        </div>
        <div class="field">
          <div class="text-field">
            <input type="password" id="loginPassword" placeholder="비밀번호 입력">
            <span class="ic ic-eye" data-toggle-password="loginPassword"><img src="assets/eye.svg" alt="비밀번호 표시"></span>
          </div>
        </div>
      </div>
      <div class="auth-btn-group">
        <button class="btn-auth disabled" id="loginBtn" data-watch="loginEmail,loginPassword" onclick="location.href='index.html'">로그인</button>
        <div class="auth-links">
          <a href="signup.html">회원가입</a>
          <span class="v-divider"></span>
          <a href="password.html">비밀번호 찾기</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
