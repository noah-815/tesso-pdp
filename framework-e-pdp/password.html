<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framework E — Change Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Inter:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ Header ============ -->
<header class="site-header">
  <div class="container">
    <nav>
      <a href="#">Shop</a>
      <a href="#">About</a>
      <a href="#">Journal</a>
      <a href="#">Info</a>
      <a href="#">The Story</a>
    </nav>
    <a class="logo" href="index.html">BRAND</a>
    <nav>
      <a href="#">Search</a>
      <a href="login.html">Sign in</a>
      <a href="cart.html">Bag [0]</a>
    </nav>
  </div>
</header>

<main class="auth-main">

  <!-- ============ Step 1 : 이메일 입력 ============ -->
  <div class="auth-box auth-step" data-step="1">
    <h1 class="auth-title">비밀번호 변경</h1>
    <div class="auth-content">
      <div class="field">
        <span class="label">이메일</span>
        <div class="text-field">
          <input type="email" id="cpEmail" placeholder="가입 시 등록한 이메일 입력">
        </div>
        <div class="supporting"></div>
      </div>
      <button class="btn-auth disabled" data-watch="cpEmail" data-next-step="2">인증 요청</button>
    </div>
  </div>

  <!-- ============ Step 2 : 인증번호 입력 ============ -->
  <div class="auth-box auth-step" data-step="2" hidden>
    <h1 class="auth-title">비밀번호 변경</h1>
    <div class="auth-content wide-gap">
      <div class="otp-box">
        <div class="text-area">
          <p class="desc">아래 이메일로 전송된 인증번호를 입력하세요</p>
          <p class="email" id="cpEmailEcho">example@gmail.com</p>
        </div>
        <div class="otp-fields">
          <input type="text" inputmode="numeric" maxlength="1">
          <input type="text" inputmode="numeric" maxlength="1">
          <input type="text" inputmode="numeric" maxlength="1">
          <input type="text" inputmode="numeric" maxlength="1">
          <input type="text" inputmode="numeric" maxlength="1">
          <input type="text" inputmode="numeric" maxlength="1">
        </div>
        <span class="timer">04:59</span>
      </div>
      <div class="auth-btn-group wide">
        <button class="btn-auth disabled" data-otp-submit data-next-step="3">이메일 인증</button>
        <div class="auth-resend">
          받은 편지함에서 메일을 찾을 수 없나요?
          <button>다시 보내기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ Step 3 : 새 비밀번호 ============ -->
  <div class="auth-box auth-step" data-step="3" hidden>
    <h1 class="auth-title">비밀번호 변경</h1>
    <div class="auth-content">
      <div class="field">
        <span class="label">새 비밀번호</span>
        <div class="text-field">
          <input type="password" id="cpPassword" placeholder="새 비밀번호 입력">
          <span class="ic ic-eye" data-toggle-password="cpPassword"><img src="assets/eye.svg" alt="비밀번호 표시"></span>
        </div>
        <div class="supporting"></div>
      </div>
      <button class="btn-auth disabled" data-watch="cpPassword" onclick="if(!this.classList.contains('disabled'))location.href='login.html'">완료</button>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
