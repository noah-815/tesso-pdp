<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Highlight — Desktop (Framework E)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  /* ─────────────────────────────────────────────────────────────
     Framework E — ProductHighlightSection / variant1 · 데스크탑
     Figma 11530:194289 · 기준 폭 1920 · 1rem = 14px

     1) Typography
        font-size = (size value − 1) × 0.0083 × screen width + 1rem
        · size value ≤ 1rem 이면 고정 → C1 12 · P4 13 · P3 14
        · 가변 : P1 18 · H2 52
     2) Spacing (mid-*)  (값 − 8) × 100vw / 1920 + 8 · 값 < 8 은 고정
     3) 이 화면의 반응형 규칙
        · 섹션      : 뷰포트를 가로·세로 100 채운다 (100vw × 100vh)
        · 텍스트 영역 : 너비 mid  (시안 1062)
        · 상품 카드   : 너비 mid  (시안 420)
        · 카드 내 이미지 영역 : 너비 mid (시안 112)
        · 카드 내 텍스트 영역 : fill (flex 1 0 0)
        · 텍스트 영역 ↔ 카드 사이 간격은 두 mid 너비를 뺀 나머지 (space-between)
          시안의 342 는 1920 에서 자동으로 나온다
     ───────────────────────────────────────────────────────────── */
  :root {
    --us: calc(100vw / 1920);              /* spacing 1px (mid-* 계산용) */

    /* Typography ------------------------------------------------- */
    --fs-c1: 12px;    /* caption-1   0.857rem → 고정 */
    --fs-p4: 13px;    /* paragraph-4 0.929rem → 고정 */
    --fs-p3: 14px;    /* paragraph-3 1rem     → 고정 */
    --fs-p1: calc((1.2857 - 1) * 0.83vw + 1rem);   /* paragraph-1 18px @1920 — 가변 */
    --fs-h2: calc((3.7143 - 1) * 0.83vw + 1rem);   /* heading-2   52px @1920 — 가변 */

    --lh-c1: 1.2;
    --lh-p3: 1.6;
    --lh-p4: 1.6;
    --lh-p1: 1.5;
    --lh-h2: 1.35;

    /* Spacing — mid-* -------------------------------------------- */
    --mid-2:  2px;                         /* 값 < 8 → 고정 */
    --mid-6:  6px;
    --mid-10: calc(  2 * var(--us) + 8px);
    --mid-12: calc(  4 * var(--us) + 8px);
    --mid-16: calc(  8 * var(--us) + 8px);
    --mid-48: calc( 40 * var(--us) + 8px);
    --mid-80: calc( 72 * var(--us) + 8px);

    /* 이 화면의 너비 — 전부 mid 공식 ------------------------------ */
    --w-text:  calc(1054 * var(--us) + 8px);   /* 시안 1062 */
    --w-card-mid: calc( 412 * var(--us) + 8px);   /* 시안 420  */
    /* 데모 — 카드 너비 하한/상한 (기본은 제한 없음) */
    --card-w-min: 0px;
    --card-w-max: 99999px;
    --w-card:  clamp(var(--card-w-min), var(--w-card-mid), var(--card-w-max));
    --w-image: calc( 104 * var(--us) + 8px);   /* 시안 112  */

    /* 상품 이미지 비율 (데모 전환) — 시안 기본 1:1 */
    --thumb-ratio: 1 / 1;

    /* Radius / Font / Color -------------------------------------- */
    --radius-xs: 4px;
    --radius-thumb: 2px;                   /* 시안 — 토큰 없음 → px */
    --font: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
    --font-en: "DM Sans", var(--font);
  }

  body[data-ratio="4-5"] { --thumb-ratio: 4 / 5; }
  body[data-ratio="3-4"] { --thumb-ratio: 3 / 4; }

  /* 이미지 채움 2안 — 어느 쪽이든 이미지 하단은 절대 뜨지 않는다.
     (세로를 항상 카드 높이에 맞추고, 비율을 지키려 폭이 따라 늘어난다.
      폭이 늘면 텍스트 열이 좁아져 잘릴 수 있는데 그게 의도된 우선순위다.)
     card : mid 폭을 하한으로 둔다 → 텍스트가 짧으면 시안 그대로 mid
     fill : 하한 없이 카드 텍스트 높이에 정확히 맞춘다
     폭이 높이에, 높이가 폭에 의존하는 순환이라 CSS 로는 풀리지 않아
     폭·하한만 JS 가 계산해 인라인으로 넣는다 (syncFill). */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; font-size: 14px; }   /* 1rem = 14px */
  body {
    font-family: var(--font);
    color: #111;
    background: #000;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img { display: block; }

  /* ── section ─────────────────────────────────────────────────── */
  .highlight {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* 뷰포트를 가로·세로 100 채운다 */
    width: 100vw;
    height: 100vh;
    padding: var(--mid-80) var(--mid-48);
    overflow: hidden;
  }
  /* media — 섹션을 꽉 채우는 배경 */
  .highlight .media { position: absolute; inset: 0; overflow: hidden; }
  .highlight .media img { width: 100%; height: 100%; object-fit: cover; }
  .highlight .overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, .2); }

  /* content — 텍스트 영역과 카드를 아래쪽에 붙이고 사이는 남는 만큼 */
  .highlight .content {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex: 1 0 0;
    min-height: 0;
    width: 100%;
    overflow: hidden;
  }

  /* ── textArea — 너비 mid ─────────────────────────────────────── */
  .highlight .text-area {
    flex: none;                            /* mid 너비를 그대로 유지 */
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-end;
    gap: var(--mid-16);
    width: var(--w-text);
    height: 100%;
    color: #fff;
  }
  .highlight .text-area .eyebrow {
    width: 100%;
    font-size: var(--fs-p3);
    line-height: var(--lh-p3);
  }
  .highlight .text-area .headline {
    width: 100%;
    font-family: var(--font-en);
    font-variation-settings: "opsz" 14;
    font-weight: 500;
    font-size: var(--fs-h2);
    line-height: var(--lh-h2);
  }
  .highlight .text-area .body {
    width: 100%;
    font-size: var(--fs-p3);
    line-height: var(--lh-p3);
  }

  /* ── overlayProductCard — 너비 mid ───────────────────────────── */
  .highlight .card {
    flex: none;                            /* mid 너비를 그대로 유지 */
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    width: var(--w-card);
    padding: var(--mid-12);
    border-radius: var(--radius-xs);
    background: rgba(0, 0, 0, .25);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
  }
  .highlight .card .row { display: flex; align-items: flex-start; gap: var(--mid-16); width: 100%; }

  /* imageArea — 세로는 카드 높이에 꽉 채우고, 폭은 비율대로 JS 가 넣는다.
     (JS 가 없을 때의 폭 = 시안 mid) */
  .highlight .card .image-area {
    flex-shrink: 0;
    align-self: stretch;
    display: flex;
    width: var(--w-image);
  }
  .highlight .card .image-area .thumb {
    /* img 는 absolute — 원본 비율(1380×1482)이 박스 높이를 밀지 않게 한다 */
    position: relative;
    flex: 1 0 0;
    min-width: 0;
    height: 100%;                       /* 비율(--thumb-ratio)은 폭으로 맞춘다 → syncFill */
    border-radius: var(--radius-thumb);
    overflow: hidden;
    background: rgba(255, 255, 255, .08);
  }
  .highlight .card .image-area .thumb img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* productInfo — 남는 폭을 채운다 (fill) */
  .highlight .card .info {
    flex: 1 0 0;
    min-width: 0;
    overflow: hidden;                   /* 이미지가 넓어지면 텍스트는 잘린다 */
    align-self: stretch;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding-top: var(--mid-2);
  }
  /* flex-basis 0 이면 부모의 자연 높이 계산에 0 으로 잡혀 카드가 이미지 높이에
     묶이고, 그 안에서 텍스트가 눌린다 → basis 는 auto 로 두고 여유가 있을 때만 늘린다 */
  .highlight .card .info .texts {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--mid-10);
    width: 100%;
  }
  .highlight .card .info .title-area {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--mid-6);
    width: 100%;
  }
  /* 글줄 높이 아래로 눌리지 않게 — 압축되면 글자가 잘려 보인다 */
  .highlight .card .info .category,
  .highlight .card .info .name,
  .highlight .card .info .price,
  .highlight .card .info .button-area,
  .highlight .text-area > * { flex-shrink: 0; }

  .highlight .card .info .category {
    width: 100%;
    font-family: var(--font-en);
    font-variation-settings: "opsz" 14;
    font-size: var(--fs-c1);
    line-height: var(--lh-c1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .highlight .card .info .name {
    width: 100%;
    font-weight: 500;
    font-size: var(--fs-p1);
    line-height: var(--lh-p1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .highlight .card .info .price {
    display: flex;
    align-items: center;
    font-size: var(--fs-p4);
    line-height: var(--lh-p4);
    white-space: nowrap;
  }
  .highlight .card .info .price .num { font-family: var(--font-en); font-variation-settings: "opsz" 14; }
  .highlight .card .info .button-area { display: flex; justify-content: flex-end; width: 100%; }
  .highlight .card .info .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;                           /* 시안 — 토큰 없음 → px */
    height: 24px;
    border-radius: var(--radius-xs);
  }
  .highlight .card .info .icon-btn img { width: 24px; height: 24px; }

  /* ── 데모 컨트롤 — 시안에 없는 요소. 삭제해도 무방 ───────────── */
  .demo-nav {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 500;
    display: grid;
    grid-template-columns: auto;
    gap: 6px;
    padding: 8px 10px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    font-family: var(--font);
    font-size: 11px;
    line-height: 1.5;
    color: #111;
    white-space: nowrap;
  }
  .demo-nav.is-min > *:not(.demo-toggle) { display: none; }
  .demo-toggle {
    justify-self: end;
    padding: 2px 6px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 3px;
    color: #777;
  }
  .demo-row { display: flex; align-items: center; gap: 8px; }
  .demo-row strong { font-size: 10px; letter-spacing: 0.04em; color: #999; text-transform: uppercase; }
  .demo-seg { display: flex; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 3px; overflow: hidden; }
  .demo-seg button { padding: 4px 9px; color: #777; background: #fff; font-family: var(--font); font-size: 11px; }
  .demo-seg button + button { border-left: 1px solid rgba(0, 0, 0, 0.1); }
  .demo-seg button.is-on { background: #111; color: #fff; font-weight: 600; }
  .demo-num { display: flex; align-items: center; gap: 4px; color: #999; }
  .demo-num input[type="checkbox"] { width: auto; margin: 0; accent-color: #2563eb; }
  .demo-num input:disabled { color: #bbb; background: #f6f6f6; }
  .demo-num.is-off { color: #ccc; }
  .demo-num input[type="number"] {
    width: 52px;
    padding: 3px 5px;
    border: 1px solid rgba(0, 0, 0, 0.14);
    border-radius: 3px;
    background: #fff;
    font-family: var(--font);
    font-size: 11px;
    color: #111;
    text-align: right;
  }
  .demo-reset {
    padding: 3px 7px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 3px;
    background: #fff;
    font-family: var(--font);
    font-size: 11px;
    color: #2563eb;
  }
  .demo-readout { color: #999; font-variant-numeric: tabular-nums; }
  .demo-readout b { color: #111; font-weight: 600; }
</style>
</head>
<body>

<section class="highlight" aria-label="Product highlight">
  <div class="media"><img src="assets/media.png" alt=""></div>
  <div class="overlay"></div>

  <div class="content">
    <div class="text-area">
      <p class="eyebrow">New Collection</p>
      <h2 class="headline">The Power of Thoughtful Details</h2>
      <p class="body">
        작은 선택 하나, 보이지 않는 디테일까지 고민하는 과정은 결국 결과의 완성도를 넘어, 경험의 차이를 만듭니다.<br>
        사람들은 모든 요소를 기억하지는 않지만, 그 안에 담긴 감각과 인상은 오래 남습니다.
      </p>
    </div>

    <div class="card">
      <div class="row">
        <div class="image-area">
          <div class="thumb"><img src="assets/thumb.png" alt=""></div>
        </div>
        <div class="info">
          <div class="texts">
            <div class="title-area">
              <p class="category">DRINK</p>
              <p class="name">전해질 보충 음료 블러드 오렌지</p>
            </div>
            <p class="price"><span class="num">40,000</span><span>원</span></p>
          </div>
          <div class="button-area">
            <button type="button" class="icon-btn" aria-label="상품 보기">
              <img src="assets/arrow-right.svg" alt="">
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<nav class="demo-nav" id="demoNav">
  <button type="button" class="demo-toggle" id="demoToggle" aria-label="패널 접기">–</button>

  <div class="demo-row">
    <strong>image fit</strong>
    <div class="demo-seg" id="fitToggle">
      <button type="button" data-imgfit="card">폭 mid 하한 (시안)</button>
      <button type="button" data-imgfit="fill">세로에 딱 맞춤</button>
    </div>
  </div>

  <div class="demo-row">
    <strong>image ratio</strong>
    <div class="demo-seg" id="ratioToggle">
      <button type="button" data-ratio="1-1">1:1</button>
      <button type="button" data-ratio="4-5">4:5</button>
      <button type="button" data-ratio="3-4">3:4</button>
    </div>
  </div>

  <div class="demo-row">
    <strong>card width</strong>
    <label class="demo-num"><input type="checkbox" id="cardWMinOn"> min <input type="number" id="cardWMin" min="0" max="4000" step="1" placeholder="–"></label>
    <label class="demo-num"><input type="checkbox" id="cardWMaxOn"> max <input type="number" id="cardWMax" min="0" max="4000" step="1" placeholder="–"></label>
    <button type="button" class="demo-reset" id="cardWReset">reset</button>
  </div>

  <p class="demo-readout" id="readout">–</p>
</nav>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const UI_KEY = 'fw-e-highlight-ui';
  const RATIO_KEY = 'fw-e-highlight-ratio';
  const FIT_KEY = 'fw-e-highlight-fit';
  const CARDW_KEY = 'fw-e-highlight-cardw';
  const w = el => el.getBoundingClientRect().width;

  function px(k) {
    const d = document.createElement('div');
    d.style.width = `var(${k})`;
    document.body.appendChild(d);
    const v = parseFloat(getComputedStyle(d).width);
    d.remove();
    return v;
  }

  /* 상품 이미지 비율 — 1:1(시안) · 4:5 · 3:4 */
  function setRatio(v) {
    document.body.dataset.ratio = v;
    document.querySelectorAll('#ratioToggle button')
      .forEach(b => b.classList.toggle('is-on', b.dataset.ratio === v));
    try { localStorage.setItem(RATIO_KEY, v); } catch (e) {}
    syncFill();
    readout();
  }
  $('#ratioToggle').addEventListener('click', e => {
    const b = e.target.closest('[data-ratio]'); if (b) setRatio(b.dataset.ratio);
  });

  /* 이미지 폭 — 카드 높이 × 비율. 세로는 어느 안이든 꽉 채운다.
     card 안은 mid 폭에서 나오는 높이를 하한(min-height)으로 둬서,
     텍스트가 짧을 때는 시안의 mid 폭 그대로가 되게 한다.
     텍스트 높이는 폭에 의존하지 않으므로(모두 1줄 nowrap) 한 번 재면 확정된다. */
  function syncFill() {
    const area = $('.image-area');
    const [a, b] = (getComputedStyle(document.body).getPropertyValue('--thumb-ratio') || '1/1')
      .split('/').map(v => parseFloat(v) || 1);

    /* mid 폭(= CSS 기본값)을 먼저 잰다 */
    area.style.minHeight = '0px';
    area.style.width = '';
    const midW = area.getBoundingClientRect().width;

    /* 이미지가 없다고 치고 텍스트 열의 자연 높이를 잰다 */
    area.style.width = '0px';
    const infoH = $('.info').getBoundingClientRect().height;

    const minH = document.body.dataset.imgfit === 'fill' ? 0 : midW * b / a;
    const rowH = Math.max(infoH, minH);
    area.style.minHeight = minH ? `${minH.toFixed(3)}px` : '';
    area.style.width = `${(rowH * a / b).toFixed(3)}px`;
  }

  /* 채움 방식 — 폭 mid 고정(시안) ↔ 세로 꽉(폭 가변) */
  function setFit(v) {
    document.body.dataset.imgfit = v;
    document.querySelectorAll('#fitToggle button')
      .forEach(b => b.classList.toggle('is-on', b.dataset.imgfit === v));
    try { localStorage.setItem(FIT_KEY, v); } catch (e) {}
    syncFill();
    readout();
  }
  $('#fitToggle').addEventListener('click', e => {
    const b = e.target.closest('[data-imgfit]'); if (b) setFit(b.dataset.imgfit);
  });

  /* 상품 카드 너비 하한/상한 — 비우면 제한 없음.
     mid 값은 그대로 두고 clamp() 로 감싼다 → 뷰포트가 넓/좁을 때만 걸린다. */
  function applyCardW(save = true) {
    const mnOn = $('#cardWMinOn').checked, mxOn = $('#cardWMaxOn').checked;
    const mn = $('#cardWMin').value.trim(), mx = $('#cardWMax').value.trim();
    /* 꺼져 있으면 값은 남겨두고 제한만 풀어 시안(mid) 과 바로 비교할 수 있게 한다 */
    $('#cardWMin').disabled = !mnOn;
    $('#cardWMax').disabled = !mxOn;
    $('#cardWMin').closest('.demo-num').classList.toggle('is-off', !mnOn);
    $('#cardWMax').closest('.demo-num').classList.toggle('is-off', !mxOn);
    const root = document.documentElement.style;
    root.setProperty('--card-w-min', mnOn && mn !== '' ? `${parseFloat(mn) || 0}px` : '0px');
    root.setProperty('--card-w-max', mxOn && mx !== '' ? `${parseFloat(mx) || 0}px` : '99999px');
    if (save) {
      try { localStorage.setItem(CARDW_KEY, JSON.stringify([mnOn, mn, mxOn, mx])); } catch (e) {}
    }
    syncFill();
    readout();
  }
  ['#cardWMin', '#cardWMax'].forEach(k => $(k).addEventListener('input', () => applyCardW()));
  ['#cardWMinOn', '#cardWMaxOn'].forEach(k => $(k).addEventListener('change', () => applyCardW()));
  $('#cardWReset').addEventListener('click', () => {
    $('#cardWMinOn').checked = $('#cardWMaxOn').checked = false;
    $('#cardWMin').value = $('#cardWMax').value = '';
    applyCardW();
  });

  function readout() {
    const sec = $('.highlight'), content = $('.content');
    const ta = $('.text-area'), card = $('.card'), img = $('.image-area'), info = $('.info');
    const cs = getComputedStyle(sec);
    const gap = w(content) - w(ta) - w(card);
    $('#readout').innerHTML =
      `viewport <b>${innerWidth} × ${innerHeight}</b> · 섹션 <b>${w(sec).toFixed(0)} × ${sec.getBoundingClientRect().height.toFixed(0)}</b> · ` +
      `여백 <b>${parseFloat(cs.paddingLeft).toFixed(2)}</b> / <b>${parseFloat(cs.paddingTop).toFixed(2)}</b><br>` +
      `텍스트 영역 <b>${w(ta).toFixed(2)}</b> (mid) · 카드 <b>${w(card).toFixed(2)}</b> ${cardWTag()} · ` +
      `이미지 영역 <b>${w(img).toFixed(2)}</b> (mid) · 카드 텍스트 <b>${w(info).toFixed(2)}</b> (fill)<br>` +
      `사이 간격 <b>${gap.toFixed(2)}</b> (나머지) · H2 <b>${px('--fs-h2').toFixed(2)}</b> · P1 <b>${px('--fs-p1').toFixed(2)}</b><br>` +
      `썸네일 <b>${(document.body.dataset.ratio || '1-1').replace('-', ':')}</b> · ` +
      `<b>${document.body.dataset.imgfit === 'fill' ? '세로 딱' : '폭 mid 하한'}</b> — ` +
      `${w($('.thumb')).toFixed(2)} × <b>${$('.thumb').getBoundingClientRect().height.toFixed(2)}</b> · ` +
      `카드 내용 높이 <b>${info.getBoundingClientRect().height.toFixed(2)}</b> · ` +
      `카드 <b>${card.getBoundingClientRect().height.toFixed(2)}</b>`;
  }
  /* 카드 너비가 mid 그대로인지, min/max 에 걸렸는지 */
  function cardWTag() {
    const mid = px('--w-card-mid'), now = w($('.card'));
    if (Math.abs(now - mid) < 0.05) return '(mid)';
    return now > mid
      ? `(min 적용 · mid ${mid.toFixed(2)})`
      : `(max 적용 · mid ${mid.toFixed(2)})`;
  }
  addEventListener('resize', () => { syncFill(); readout(); });

  $('#demoToggle').addEventListener('click', () => {
    const min = $('#demoNav').classList.toggle('is-min');
    $('#demoToggle').textContent = min ? '+' : '–';
    try { localStorage.setItem(UI_KEY, min ? 'min' : 'open'); } catch (e) {}
  });
  try {
    if (localStorage.getItem(UI_KEY) === 'min') {
      $('#demoNav').classList.add('is-min');
      $('#demoToggle').textContent = '+';
    }
  } catch (e) {}

  try {
    const saved = JSON.parse(localStorage.getItem(CARDW_KEY) || '[]');
    if (Array.isArray(saved) && saved.length === 4) {
      $('#cardWMinOn').checked = !!saved[0];
      $('#cardWMin').value = saved[1] || '';
      $('#cardWMaxOn').checked = !!saved[2];
      $('#cardWMax').value = saved[3] || '';
    }
  } catch (e) {}
  applyCardW(false);

  let savedFit = 'card';
  try { savedFit = localStorage.getItem(FIT_KEY) || 'card'; } catch (e) {}
  setFit(savedFit);
  let savedRatio = '1-1';
  try { savedRatio = localStorage.getItem(RATIO_KEY) || '1-1'; } catch (e) {}
  setRatio(savedRatio);
  /* 웹폰트가 늦게 오면 텍스트 높이가 바뀌므로 로드 후 한 번 더 */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { syncFill(); readout(); });
  }
  syncFill();
  readout();
})();
</script>

</body>
</html>
