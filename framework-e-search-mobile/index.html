<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search — Mobile (Framework E)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Inter:wght@600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  /* ─────────────────────────────────────────────────────────────
     Framework E — Search · 모바일
     Figma 10131:121405 · 기준 폭 390 · 1rem = 14px

     1) Typography  font-size = size value × 100vw / 390   (450px 에서 상한)
        · 데스크탑의 "≤ 1rem 고정" 예외는 모바일에 적용하지 않는다
     2) Spacing (mid-*)  (값 − 8) × 100vw / 390 + 8 · 값 < 8 은 고정
     3) 가로 여백은 px-16 고정 (뷰포트 무관) · 세로는 mid
     ───────────────────────────────────────────────────────────── */
  :root {
    --tw: min(100vw, 450px);                  /* typography 기준 폭 */
    --ut: calc(var(--tw) / 390);              /* type 1px */
    --us: calc(100vw / 390);                  /* spacing 1px */

    /* Typography ------------------------------------------------- */
    --fs-c2: calc(11 * var(--ut));
    --fs-c1: calc(12 * var(--ut));
    --fs-p4: calc(13 * var(--ut));
    --fs-p3: calc(14 * var(--ut));
    --fs-p2: calc(15 * var(--ut));

    --lh-p2: 1.5;
    --lh-p3: 1.6;
    --lh-p4: 1.6;
    --lh-c1: 1.2;
    --lh-c2: 1.2;

    /* Spacing — mid-* -------------------------------------------- */
    --mid-2:  2px;                            /* 값 < 8 → 고정 */
    --mid-4:  4px;
    --mid-6:  6px;
    --mid-8:  8px;
    --mid-12: calc(  4 * var(--us) + 8px);
    --mid-16: calc(  8 * var(--us) + 8px);
    --mid-20: calc( 12 * var(--us) + 8px);
    --mid-24: calc( 16 * var(--us) + 8px);
    --mid-32: calc( 24 * var(--us) + 8px);
    --mid-40: calc( 32 * var(--us) + 8px);

    /* px-* — 뷰포트 무관 고정 ------------------------------------ */
    --px-16: 16px;                            /* 화면 좌우 여백 */

    /* productCard 간격 — A안 2열(mid-12) · B안 1열(mid-16)
       vw 안 : 390 에서 시안 값이 되는 순수 vw. mid 와 달리 8px 하한이
       없어 화면이 좁아질수록 그대로 비례해 줄어든다. */
    --card-gap:    var(--mid-12);
    --card-gap-vw: calc(12 * 100vw / 390);    /* 3.0769vw */
    --card-gap-y:  var(--mid-40);             /* A안 행 간격 */

    /* search 상하 padding 2안 (데모 토글) — 시안은 24px, 바인딩 없음
       em  : @em base P2 → 24 / 15 = 1.6em · 폰트가 커지면 함께 커짐
       mid : mid-24      → 뷰포트에 따라 증감 */
    --search-pad-y: 1.6em;

    /* Radius / Font / Color -------------------------------------- */
    --radius-2xs: 3px;
    --radius-xs:  4px;
    --radius-sm:  6px;
    --font: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
    --font-en: "DM Sans", var(--font);
    --font-header: "Inter", "DM Sans", var(--font);
    --header-h: 60px;                         /* mobileH_header — 토큰 없음 → px */
    --c-text: #111;
    --c-placeholder: rgba(17, 17, 17, 0.3);
    --c-line-soft: rgba(0, 0, 0, 0.1);
    --c-thumb-bg: #f4f4f4;
  }

  /* 카드 스타일 B — 1열 · productInfo 가 카드 안에서 배경(#f9f9f9)을 갖는다.
     시안(8433:274297) : thumbnail annotation "상품 카드형 디자인일 때는
     모바일에서 1열로 노출" · 카드 사이 gap = mid-16 */
  body[data-cardstyle="b"] {
    --card-gap:    var(--mid-16);
    --card-gap-vw: calc(16 * 100vw / 390);    /* 4.1026vw */
    --card-gap-y:  var(--card-gap);
  }

  /* 카드 간격 2안 — mid (하한 8px) ↔ 시안 값을 vw 로 환산 (하한 없음) */
  body[data-cardgap="vw"] { --card-gap: var(--card-gap-vw); }

  /* search 상하 padding — em(기본) ↔ mid-24 */
  body[data-searchpad="mid"] { --search-pad-y: var(--mid-24); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    font-size: 14px;                          /* 1rem = 14px */
    overflow-x: hidden;                       /* 100vw 기반 계산 시 가로 스크롤 방지 */
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  html::-webkit-scrollbar { display: none; }
  body {
    min-height: 100vh;
    font-family: var(--font);
    color: var(--c-text);
    background: #fff;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input  { font: inherit; color: inherit; background: none; border: 0; outline: 0; border-radius: 0; -webkit-appearance: none; }
  img { display: block; }
  a { color: inherit; text-decoration: none; }
  /* 브라우저 기본 검색 초기화(X) 버튼 미노출 — 시안에 없는 요소 */
  input[type="search"] { -webkit-appearance: none; appearance: none; }
  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration,
  input[type="search"]::-webkit-search-results-button,
  input[type="search"]::-webkit-search-results-decoration {
    -webkit-appearance: none;
    appearance: none;
    display: none;
  }

  /* ── mobileH_header ──────────────────────────────────────────── */
  .header {
    position: sticky;
    top: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--header-h);                  /* 60px — 토큰 없음 → px */
    padding: 0 var(--px-16);
    background: #fff;
  }
  .header .side {
    display: flex;
    align-items: center;
    min-width: 48px;
    height: 48px;
    font-family: var(--font-en);
    font-size: var(--fs-p4);
    line-height: var(--lh-p4);
    text-transform: uppercase;
    color: #372320;
    white-space: nowrap;
  }
  .header .side.right { justify-content: flex-end; }
  .header .logo {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-header);
    font-weight: 600;
    font-size: 20px;                          /* 로고 — 가변 로직 제외 */
    line-height: 28px;
    color: #372320;
    white-space: nowrap;
  }

  /* ── search ──────────────────────────────────────────────────
     상하 24px 은 바인딩 없음 → px 고정 · 좌우는 px-16 */
  .search-bar {
    display: flex;
    align-items: center;
    gap: var(--mid-12);
    width: 100%;
    /* em 안이 P2 기준으로 풀리도록 컨테이너 font-size 를 P2 로 둔다 */
    font-size: var(--fs-p2);
    padding: var(--search-pad-y) var(--px-16);
    background: #fff;
  }
  .search-bar .field { flex: 1 0 0; min-width: 0; display: flex; align-items: center; overflow: hidden; }
  .search-bar input {
    width: 100%;
    font-size: var(--fs-p2);
    line-height: var(--lh-p2);
    color: var(--c-text);
  }
  .search-bar input::placeholder { color: var(--c-placeholder); }
  .search-bar .total {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: var(--mid-6);
    font-size: var(--fs-c1);
    line-height: var(--lh-c1);
    white-space: nowrap;
  }
  .search-bar .total .num { font-family: var(--font-en); font-variation-settings: "opsz" 14; }

  /* ── productGroup ────────────────────────────────────────────── */
  .product-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--card-gap-y);
    width: 100%;
    padding: var(--mid-12) var(--px-16) var(--mid-40);
  }
  .product-group .row {
    display: flex;
    align-items: flex-start;
    gap: var(--card-gap);
    width: 100%;
  }

  /* ── productCard ─────────────────────────────────────────────── */
  .card {
    display: flex;
    flex: 1 0 0;
    min-width: 0;
    flex-direction: column;
    align-items: flex-start;
  }
  .card .image-area {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--c-thumb-bg);
    border-radius: var(--radius-sm);          /* 모바일 6 (데스크탑은 8) */
  }
  .card .image-area img { width: 100%; height: 100%; object-fit: cover; }
  /* badge — 위치는 px, padding 은 em (@em base : C2) — 시안 6 / 8px */
  .card .badge {
    position: absolute;
    left: 10px;
    top: 10px;
    padding: 0.5455em 0.7273em;
    background: #111;
    border-radius: var(--radius-2xs);
    font-family: var(--font-en);
    font-size: var(--fs-c2);
    line-height: var(--lh-c2);
    color: #fff;
    white-space: nowrap;
  }
  .card .info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--mid-6);
    width: 100%;
    padding: var(--mid-12) var(--mid-4) 0;    /* 모바일 pt = mid-12 */
  }
  /* ── 카드 스타일 B ──────────────────────────────────────────────
     카드 전체가 radius-sm 으로 클리핑되고, productInfo 가 카드 내부에서
     배경 #f9f9f9 + padding mid-20 / px-16 을 갖는다. */
  body[data-cardstyle="b"] .card {
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  body[data-cardstyle="b"] .card .image-area { border-radius: 0; }
  body[data-cardstyle="b"] .card .info {
    background: #f9f9f9;
    padding: var(--mid-20) var(--px-16);
  }

  /* 이름 — 줄바꿈 허용 (시안 : 모바일에서 2줄) */
  .card .name {
    width: 100%;
    font-weight: 500;
    font-size: var(--fs-p3);
    line-height: var(--lh-p3);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .price {
    display: flex;
    align-items: baseline;
    gap: var(--mid-4);
    width: 100%;
    font-size: var(--fs-p3);
    line-height: var(--lh-p3);
    white-space: nowrap;
  }
  .card .price .amount { display: flex; align-items: center; }
  .card .price .amount .num { font-family: var(--font-en); font-variation-settings: "opsz" 14; }
  .card .price .original { position: relative; display: flex; align-items: center; opacity: .5; }
  .card .price .original::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: #111;
    transform: translateY(-50%);
  }

  /* ── pagination — 모바일은 pageCounter 형태 ──────────────────── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: var(--mid-32) var(--mid-8);
  }
  .pagination .inner { display: flex; align-items: center; gap: var(--mid-8); }
  /* iconButton/contained — 어노테이션 없음 → px */
  .pagination .nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    background: #fff;
    box-shadow: inset 0 0 0 1px var(--c-line-soft);
    border-radius: var(--radius-xs);
  }
  .pagination .nav-btn span {
    display: block;
    width: 16px;
    height: 16px;
    font-size: 13px;
    line-height: 16px;
    text-align: center;
  }
  /* pageCounter — annotation : current, total min-width = 2ch */
  .pagination .counter {
    display: flex;
    align-items: center;
    gap: var(--mid-8);
    padding: var(--mid-4);
    font-family: var(--font-en);
    font-size: var(--fs-p4);
    line-height: var(--lh-p4);
    color: #1d1d1d;
    font-variation-settings: "opsz" 14;
  }
  .pagination .counter .n {
    display: flex;
    align-items: center;
    justify-content: center;
    /* annotation : current, total min-width = 2ch.
       total 이 세 자릿수 이상이면 N(= total 자릿수) ch 를 둘 다에 적용 */
    min-width: calc(var(--pg-ch, 2) * 1ch);
  }

  /* ── 데모 컨트롤 — 시안에 없는 요소 ─────────────────────────── */
  .demo-nav {
    position: fixed;
    right: 8px;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 500;
    max-width: calc(100vw - 16px);
    padding: 7px 8px;
    border: 1px solid rgba(0, 0, 0, .1);
    border-radius: 6px;
    background: rgba(255, 255, 255, .95);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, .12);
    font-family: var(--font);
    font-size: 10px;
    line-height: 1.4;
  }
  .demo-nav.is-min .demo-body { display: none; }
  .demo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .demo-head strong { font-size: 9px; letter-spacing: .04em; color: #999; text-transform: uppercase; }
  .demo-head button { width: 18px; height: 18px; border: 1px solid rgba(0, 0, 0, .12); border-radius: 3px; color: #777; line-height: 1; }
  .demo-body { margin-top: 6px; }
  .demo-seg { display: flex; flex-wrap: wrap; gap: 3px; }
  .demo-seg button {
    padding: 4px 7px;
    border: 1px solid rgba(0, 0, 0, .1);
    border-radius: 3px;
    color: #777;
    background: #fff;
    white-space: nowrap;
  }
  .demo-seg button.is-on { background: #111; color: #fff; font-weight: 600; border-color: #111; }
  .demo-fields {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
  }
  .demo-fields label { display: flex; align-items: center; gap: 2px; color: #777; }
  .demo-fields input[type="number"] {
    width: 34px;
    padding: 3px;
    border: 1px solid rgba(0, 0, 0, .15);
    border-radius: 3px;
    font-size: 10px;
    text-align: right;
    background: #fff;
  }
  .demo-reset {
    padding: 3px 6px;
    border: 1px solid rgba(0, 0, 0, .15);
    border-radius: 3px;
    color: #777;
    background: #fff;
  }
  .demo-readout {
    margin-top: 5px;
    padding-top: 4px;
    border-top: 1px solid rgba(0, 0, 0, .08);
    color: #999;
    font-variant-numeric: tabular-nums;
  }
  .demo-readout b { color: #111; font-weight: 600; }
</style>

<header class="header">
  <span class="side">Menu</span>
  <p class="logo">BRAND</p>
  <span class="side right">Bag [0]</span>
</header>

<!-- search -->
<div class="search-bar">
  <div class="field">
    <input type="search" id="q" value="전해질" placeholder="검색어를 입력하세요" aria-label="검색어">
  </div>
  <p class="total">검색 결과 <span class="num" id="total">12</span></p>
</div>

<main>
  <!-- productGroup -->
  <div class="product-group" id="grid"></div>
  <!-- pagination -->
  <nav class="pagination" id="pagination">
    <div class="inner">
      <button type="button" class="nav-btn" aria-label="이전"><span>‹</span></button>
      <div class="counter"><span class="n">1</span><span>/</span><span class="n">10</span></div>
      <button type="button" class="nav-btn" aria-label="다음"><span>›</span></button>
    </div>
  </nav>
</main>

<!-- 데모 컨트롤 — 시안에 없는 요소 -->
<nav class="demo-nav" id="demoNav">
  <div class="demo-head">
    <strong>search</strong>
    <button type="button" id="demoToggle" aria-label="패널 접기">–</button>
  </div>
  <div class="demo-body">
    <div class="demo-seg" id="styleToggle">
      <button type="button" data-cardstyle="a">card A</button>
      <button type="button" data-cardstyle="b">card B</button>
    </div>
    <div class="demo-seg" id="gapToggle">
      <button type="button" data-cardgap="mid">gap mid</button>
      <button type="button" data-cardgap="vw">gap vw</button>
    </div>
    <div class="demo-seg" id="padToggle">
      <button type="button" data-searchpad="em">em (P2)</button>
      <button type="button" data-searchpad="mid">mid-24</button>
    </div>
    <div class="demo-fields" id="typeFields">
      <label>P2<input type="number" id="fsP2" min="8" max="48" step="1" value="15"></label>
      <label>P3<input type="number" id="fsP3" min="8" max="48" step="1" value="14"></label>
      <label>P4<input type="number" id="fsP4" min="8" max="48" step="1" value="13"></label>
      <label>C1<input type="number" id="fsC1" min="8" max="48" step="1" value="12"></label>
      <label>C2<input type="number" id="fsC2" min="8" max="48" step="1" value="11"></label>
      <button type="button" class="demo-reset" id="fsReset">reset</button>
    </div>
    <p class="demo-readout" id="readout">–</p>
  </div>
</nav>

<script>
(() => {
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const UI_KEY = 'fw-e-search-m-ui';

  function px(k) {
    const d = document.createElement('div');
    d.style.width = `var(${k})`;
    document.body.appendChild(d);
    const v = parseFloat(getComputedStyle(d).width);
    d.remove();
    return v;
  }

  const NAMES = [
    '전해질 보충 음료 블러드 오렌지',
    '전해질 보충 음료 레몬 라임',
    '제로 슈가 스파클링 워터 자몽',
    '데일리 미네랄 워터 500ml',
  ];
  const PRICES = [[40000, 50000], [38000, null], [42000, 48000], [22000, null]];

  function card(i) {
    const name = NAMES[i % NAMES.length];
    const [price, was] = PRICES[i % PRICES.length];
    const img = `assets/product-${(i % 4) + 1}.png`;
    const won = n => n.toLocaleString('ko-KR');
    return `
      <a class="card" href="#">
        <div class="image-area">
          <img src="${img}" alt="">
          ${i === 0 ? '<span class="badge">SOLD OUT</span>' : ''}
        </div>
        <div class="info">
          <p class="name">${name}</p>
          <p class="price">
            <span class="amount"><span class="num">${won(price)}</span><span>원</span></span>
            ${was ? `<span class="original"><span class="num">${won(was)}</span><span>원</span></span>` : ''}
          </p>
        </div>
      </a>`;
  }

  const COUNT = 12;                        /* A안 2열 × 6행 · B안 1열 × 12 */
  function render() {
    const per = document.body.dataset.cardstyle === 'b' ? 1 : 2;
    const rows = COUNT / per;
    $('#grid').innerHTML = Array.from({ length: rows }, (_, r) =>
      `<div class="row">${Array.from({ length: per }, (_, c) => card(r * per + c)).join('')}</div>`
    ).join('');
    $('#total').textContent = COUNT;
  }

  /* ── 데모 — 카드 스타일 (A ↔ B) ───────────────────────────── */
  const STYLE_KEY = 'fw-e-search-m-cardstyle';
  function setStyle(mode) {
    document.body.dataset.cardstyle = mode;
    $$('#styleToggle button').forEach(b => b.classList.toggle('is-on', b.dataset.cardstyle === mode));
    try { localStorage.setItem(STYLE_KEY, mode); } catch (e) {}
    render();
    readout();
  }
  $('#styleToggle').addEventListener('click', e => {
    const b = e.target.closest('[data-cardstyle]'); if (b) setStyle(b.dataset.cardstyle);
  });

  /* ── 데모 — 카드 간격 (mid ↔ vw) ──────────────────────────── */
  const GAP_KEY = 'fw-e-search-m-gap';
  function setGap(mode) {
    document.body.dataset.cardgap = mode;
    $$('#gapToggle button').forEach(b => b.classList.toggle('is-on', b.dataset.cardgap === mode));
    try { localStorage.setItem(GAP_KEY, mode); } catch (e) {}
    readout();
  }
  $('#gapToggle').addEventListener('click', e => {
    const b = e.target.closest('[data-cardgap]'); if (b) setGap(b.dataset.cardgap);
  });

  /* ── 데모 — search 상하 padding (em ↔ mid) ────────────────── */
  const PAD_KEY = 'fw-e-search-m-pad';
  function setPad(mode) {
    document.body.dataset.searchpad = mode;
    $$('#padToggle button').forEach(b => b.classList.toggle('is-on', b.dataset.searchpad === mode));
    try { localStorage.setItem(PAD_KEY, mode); } catch (e) {}
    readout();
  }
  $('#padToggle').addEventListener('click', e => {
    const b = e.target.closest('[data-searchpad]'); if (b) setPad(b.dataset.searchpad);
  });

  /* ── 데모 — 폰트 크기 ─────────────────────────────────────── */
  const FS_KEY = 'fw-e-search-m-fs';
  const FS_DEFAULT = { p2: 15, p3: 14, p4: 13, c1: 12, c2: 11 };
  const FS_KEYS = Object.keys(FS_DEFAULT);
  /* 모바일 수식 : size × 100vw / 390 (450px 에서 상한) */
  const fsExpr = v => `calc(${v} * var(--ut))`;
  const fsVal = k => {
    const v = parseInt($(`#fs${k.toUpperCase()}`).value, 10);
    return Number.isFinite(v) ? Math.min(48, Math.max(8, v)) : FS_DEFAULT[k];
  };
  function applyFs() {
    const vals = {};
    FS_KEYS.forEach(k => {
      const v = fsVal(k);
      vals[k] = v;
      document.body.style.setProperty(`--fs-${k}`, fsExpr(v));
    });
    try { localStorage.setItem(FS_KEY, JSON.stringify(vals)); } catch (e) {}
    readout();
  }
  $('#typeFields').addEventListener('input', e => {
    if (e.target.matches('input[type="number"]')) applyFs();
  });
  $('#typeFields').addEventListener('change', e => {
    if (!e.target.matches('input[type="number"]')) return;
    e.target.value = fsVal(e.target.id.slice(2).toLowerCase());
    applyFs();
  });
  $('#fsReset').addEventListener('click', () => {
    Object.entries(FS_DEFAULT).forEach(([k, v]) => { $(`#fs${k.toUpperCase()}`).value = v; });
    applyFs();
  });

  function readout() {
    const c = $('.card');
    $('#readout').innerHTML =
      `viewport <b>${innerWidth}px</b> · 좌우 <b>${px('--px-16').toFixed(2)}</b> · ` +
      `카드 간격 <b>${px('--card-gap').toFixed(2)}</b> (${document.body.dataset.cardgap || 'mid'})<br>` +
      `카드 <b>${c ? c.getBoundingClientRect().width.toFixed(2) : '–'}px</b> · ` +
      `행 간격 <b>${px('--card-gap-y').toFixed(2)}</b> · ` +
      `style <b>${(document.body.dataset.cardstyle || 'a').toUpperCase()}</b><br>` +
      `search 상하 <b>${document.body.dataset.searchpad || 'em'}</b> ` +
      `<b>${parseFloat(getComputedStyle($('.search-bar')).paddingTop).toFixed(2)}</b> · ` +
      `바 높이 <b>${$('.search-bar').getBoundingClientRect().height.toFixed(2)}</b><br>` +
      FS_KEYS.map(k => `${k.toUpperCase()} <b>${px('--fs-' + k).toFixed(2)}</b>`).join(' · ');
  }
  window.addEventListener('resize', readout);

  $('#demoToggle').addEventListener('click', () => {
    const min = !$('#demoNav').classList.contains('is-min');
    $('#demoNav').classList.toggle('is-min', min);
    $('#demoToggle').textContent = min ? '+' : '–';
    try { localStorage.setItem(UI_KEY, min ? 'min' : 'open'); } catch (e) {}
  });
  try {
    if (localStorage.getItem(UI_KEY) === 'min') { $('#demoNav').classList.add('is-min'); $('#demoToggle').textContent = '+'; }
  } catch (e) {}

  try {
    const saved = JSON.parse(localStorage.getItem(FS_KEY) || 'null');
    if (saved) Object.entries(saved).forEach(([k, v]) => { const el = $(`#fs${k.toUpperCase()}`); if (el) el.value = v; });
  } catch (e) {}
  applyFs();
  let pad = 'em';
  try { pad = localStorage.getItem(PAD_KEY) || 'em'; } catch (e) {}
  setPad(pad);
  let gap = 'mid', cstyle = 'a';
  try { gap = localStorage.getItem(GAP_KEY) || 'mid'; } catch (e) {}
  try { cstyle = localStorage.getItem(STYLE_KEY) || 'a'; } catch (e) {}
  setGap(gap);
  setStyle(cstyle);

  /* pageCounter — annotation : current · total min-width = N ch
     (N = total 자릿수, 최소 2). total 이 바뀌면 둘 다 같은 N 으로 맞춘다. */
  function syncPageCounter() {
    document.querySelectorAll('.pagination .counter').forEach(c => {
      const ns = c.querySelectorAll('.n');
      const total = (ns[ns.length - 1]?.textContent || '').replace(/\D/g, '');
      c.style.setProperty('--pg-ch', String(Math.max(2, total.length)));
    });
  }
  syncPageCounter();
  readout();
})();
</script>
