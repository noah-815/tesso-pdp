<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Padding — Desktop (Framework E)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Inter:wght@600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* ─────────────────────────────────────────────────────────────
     Framework E · visual banner (variant1 · 텍스트 + 버튼) (Desktop) — 반응형
     Figma 14413:338389 · 디자인 기준 폭 1920 · 1rem = 14px

     1) Typography
        font-size = (size value − 1) × 0.0083 × screen width + 1rem
        · size value = rem (1rem = 14px), 0.0083 × screen width = 0.83vw
        · size value ≤ 1rem(14px) 은 뷰포트와 무관하게 px 고정
        → 가변은 H2(52) · P2(16) · 로고(20) / 고정은 P3(14) · 버튼(13)
     2) Spacing — 시안에 맵핑된 토큰 그대로
        · mid-* : (값 − 8) × 100vw / 1920 + 8, 값 < 8 이면 값 그대로 고정
        · em-*  : 해당 요소 폰트 크기 기준 N px (버튼 padding)
        · 토큰 없는 값(헤더 54 · 좌우 16 · 메뉴 간격 12 / 8) = px 고정
     3) 섹션 안쪽 패딩 — 시안 상하 mid-64 · 좌우 mid-36. 데모 패널에서 mid / vw 비교 + 값 조정
        · mid : (N − 8) × 100vw / 1920 + 8
        · vw  : N × 100vw / 1920   (64 → 3.3333vw · 36 → 1.875vw)
     4) 섹션 높이 — 헤더를 뺀 화면 높이 (100vh − 헤더 54)
     ───────────────────────────────────────────────────────────── */
  :root {
    /* 기준 단위 -------------------------------------------------- */
    --us: calc(100vw / 1920);            /* spacing 1px */
    --header-h: 54px;                    /* set06_header — 토큰 없음 → px */

    /* Typography ------------------------------------------------- */
    --fs-btn:  13px;                                    /* button-label-medium → 고정 */
    --fs-p3:   14px;                                    /* paragraph-3 1rem    → 고정 */
    --fs-p2:   calc((1.1429 - 1) * 0.83vw + 1rem);      /* paragraph-2 16px @1920 — 가변 */
    --fs-logo: calc((1.4286 - 1) * 0.83vw + 1rem);      /* 로고        20px @1920 — 가변 */
    --fs-h2:   calc((3.7143 - 1) * 0.83vw + 1rem);      /* heading-2   52px @1920 — 가변 */

    /* Spacing — mid-* ------------------------------------------- */
    --mid-4:  4px;                       /* 값 < 8 → 고정 */
    --mid-8:  8px;
    --mid-12: calc( 4 * var(--us) + 8px);
    --mid-36: calc(28 * var(--us) + 8px);

    /* 섹션 안쪽 패딩 — 데모 패널이 값을 심는다 (mid-N / vw-N 의 N) */
    --pad-y-val: 64;
    --pad-x-val: 36;
    --pad-y: calc((var(--pad-y-val) - 8) * var(--us) + 8px);
    --pad-x: calc((var(--pad-x-val) - 8) * var(--us) + 8px);

    --radius-xs: 4px;

    /* Color ------------------------------------------------------ */
    --c-header: #372320;
    --c-header-bg: #fff;                 /* background/base */

    /* Font ------------------------------------------------------- */
    --font-en: "DM Sans", "Pretendard", sans-serif;
    --font-kr: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
    --font-logo: "Inter", sans-serif;
  }

  body[data-padunit="mid"] {
    --pad-y: calc((var(--pad-y-val) - 8) * var(--us) + 8px);
    --pad-x: calc((var(--pad-x-val) - 8) * var(--us) + 8px);
  }
  body[data-padunit="vw"] {
    --pad-y: calc(var(--pad-y-val) * var(--us));
    --pad-x: calc(var(--pad-x-val) * var(--us));
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }

  html {
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    font-size: 14px;                     /* 1rem = 14px */
  }

  body {
    background: #fff;
    color: #111;
    font-family: var(--font-kr);
    font-size: var(--fs-p3);
    line-height: 1.6;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img { display: block; }
  a { color: inherit; text-decoration: none; }

  /* DM Sans 는 시안처럼 optical size 14 로 고정 */
  .en { font-family: var(--font-en); font-variation-settings: "opsz" 14; }

  /* ── set06_header ───────────────────────────────────────────── */
  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    height: var(--header-h);
    padding: 0 16px;
    background: var(--c-header-bg);
  }

  .header__container {
    position: relative;
    flex: 1 0 0;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header__nav { display: flex; gap: 12px; height: 100%; }

  .header__item {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 8px;
    font-size: var(--fs-p3);             /* 14px — 고정 */
    line-height: 1.6;
    color: var(--c-header);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .header__logo {
    position: absolute;
    top: calc(50% + 0.5px);
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-logo);
    font-weight: 600;
    font-size: var(--fs-logo);           /* 20px @1920 — 가변 */
    line-height: 28px;
    color: var(--c-header);
    white-space: nowrap;
  }

  /* ── variant1 — 미디어 + 텍스트 + 버튼 ──────────────────────── */
  .banner {
    position: relative;
    display: flex;
    flex-direction: column;
    height: calc(100vh - var(--header-h));    /* 헤더 제외 화면 높이 */
    height: calc(100dvh - var(--header-h));   /* 지원 브라우저는 dvh */
    padding: var(--pad-y) var(--pad-x);       /* 시안 mid-64 / mid-36 — 데모에서 vw 와 전환 */
    overflow: hidden;
  }

  .banner__media {
    position: absolute;
    inset: 0;
    overflow: hidden;
    -webkit-mask: url("assets/media-mask.svg") no-repeat 0 0 / 100% 100%;
            mask: url("assets/media-mask.svg") no-repeat 0 0 / 100% 100%;
  }

  .banner__media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .banner__overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.2); }

  .banner__content {
    position: relative;
    flex: 1 0 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-end;
    gap: var(--mid-36);
  }

  .banner__text { display: flex; flex-direction: column; gap: var(--mid-12); width: 100%; color: #fff; }
  .banner__title { font-weight: 500; font-size: var(--fs-h2); line-height: 1.3; }   /* 52px @1920 — 가변 */
  .banner__desc  { font-size: var(--fs-p2); line-height: 1.5; color: rgba(255, 255, 255, 0.8); }   /* 16px @1920 — 가변 */

  .banner__buttons { display: flex; align-items: flex-start; gap: var(--mid-8); }

  /* onMediaButton — em-13 / em-26 @13px (+ 선 1px) */
  .on-media-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--mid-4);
    padding: 1em 2em;
    border: 1px solid transparent;
    border-radius: var(--radius-xs);
    font-weight: 500;
    font-size: var(--fs-btn);            /* 13px — 고정 */
    line-height: 1.2;
    white-space: nowrap;
  }

  .on-media-btn--filled   { background: #fff; color: #111; }
  .on-media-btn--outlined { border-color: #fff; background: transparent; color: #fff; }

  /* 아래 확인용 여백 — 시안에 없음 */
  .spacer { height: 60vh; }

  /* ── 데모 패널 — 시안에 없는 요소. 삭제해도 무방 ───────────── */
  .demo-nav {
    position: fixed;
    top: 70px;
    right: 16px;
    z-index: 500;
    display: grid;
    grid-template-columns: auto auto;
    gap: 6px 8px;
    align-items: center;
    padding: 8px 10px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    font-family: var(--font-kr);
    font-size: 11px;
    line-height: 1.4;
    color: #111;
    white-space: nowrap;
  }

  .demo-nav.is-min > *:not(.demo-toggle) { display: none; }
  .demo-toggle { grid-column: 1 / -1; justify-self: end; padding: 2px 6px; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 3px; color: #777; }
  .demo-nav strong { font-size: 10px; letter-spacing: 0.04em; color: #999; text-transform: uppercase; }
  .demo-seg { justify-self: start; display: flex; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 3px; overflow: hidden; }
  .demo-seg button { padding: 4px 9px; color: #777; background: #fff; font-size: 11px; }
  .demo-seg button + button { border-left: 1px solid rgba(0, 0, 0, 0.1); }
  .demo-seg button.is-on { background: #111; color: #fff; font-weight: 600; }

  .demo-value { justify-self: start; display: flex; align-items: center; gap: 6px; color: #777; }
  .demo-value input[type="number"] {
    width: 56px;
    padding: 3px 4px;
    border: 1px solid rgba(0, 0, 0, 0.14);
    border-radius: 3px;
    background: #fff;
    font-family: var(--font-kr);
    font-size: 11px;
    color: #111;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .demo-value .calc { font-variant-numeric: tabular-nums; }
  .demo-reset { justify-self: start; padding: 3px 7px; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 3px; background: #fff; font-size: 11px; color: #2563eb; }

  .demo-readout {
    grid-column: 1 / -1;
    padding-top: 4px;
    margin-top: 2px;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    color: #999;
    font-variant-numeric: tabular-nums;
  }

  .demo-readout b { color: #111; font-weight: 600; }
</style>
</head>
<body data-padunit="mid">

<!-- set06_header -->
<header class="header">
  <div class="header__container">
    <nav class="header__nav">
      <a class="header__item en" href="#">Shop</a>
      <a class="header__item en" href="#">About</a>
      <a class="header__item en" href="#">Journal</a>
      <a class="header__item en" href="#">Info</a>
      <a class="header__item en" href="#">The Story</a>
    </nav>
    <div class="header__nav">
      <a class="header__item en" href="#">Search</a>
      <a class="header__item en" href="#">Sign in</a>
      <a class="header__item en" href="#">Bag [0]</a>
    </div>
    <a class="header__logo" href="#">BRAND</a>
  </div>
</header>

<!-- variant1 -->
<section class="banner">
  <div class="banner__media"><img src="assets/media.png" alt=""></div>
  <div class="banner__overlay"></div>
  <div class="banner__content">
    <div class="banner__text">
      <h2 class="banner__title en">Lorem ipsum dolor sit amet</h2>
      <p class="banner__desc">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Graecis praetorem, consuetudinum, maiores, tribus saluti reprehensa.</p>
    </div>
    <div class="banner__buttons">
      <a class="on-media-btn on-media-btn--filled en" href="#">Button Label</a>
      <a class="on-media-btn on-media-btn--outlined en" href="#">Button Label</a>
    </div>
  </div>
</section>
<div class="spacer"></div>

<!-- 데모 컨트롤 — 시안에 없는 요소 -->
<nav class="demo-nav" id="demoNav">
  <button type="button" class="demo-toggle" id="demoToggle" aria-label="패널 접기">–</button>
  <strong>section padding</strong>
  <div class="demo-seg" id="padToggle">
    <button type="button" data-unit="mid">mid (시안)</button>
    <button type="button" data-unit="vw">vw</button>
  </div>
  <strong>상하 (N)</strong>
  <div class="demo-value">
    <input type="number" id="padYVal" min="0" max="300" step="1" value="64" aria-label="상하 패딩 값">
    <span class="calc" id="padYCalc">–</span>
  </div>
  <strong>좌우 (N)</strong>
  <div class="demo-value">
    <input type="number" id="padXVal" min="0" max="300" step="1" value="36" aria-label="좌우 패딩 값">
    <span class="calc" id="padXCalc">–</span>
  </div>
  <span></span>
  <button type="button" class="demo-reset" id="reset">reset (mid-64 · mid-36)</button>
  <p class="demo-readout" id="readout">–</p>
</nav>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const KEY = 'fw-e-hero-padding', UI_KEY = 'fw-e-hero-padding-ui';
  const DEF = { unit: 'mid', y: 64, x: 36 };
  const root = document.documentElement.style;
  let state = { ...DEF };
  try { state = { ...DEF, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) {}

  const clampNum = (v, lo, hi, d) => { const n = Math.round(Number(v)); return Number.isFinite(n) && v !== '' ? Math.max(lo, Math.min(hi, n)) : d; };

  function apply() {
    state.unit = state.unit === 'vw' ? 'vw' : 'mid';
    document.body.dataset.padunit = state.unit;
    root.setProperty('--pad-y-val', state.y);
    root.setProperty('--pad-x-val', state.x);
    /* mid 에서 값이 8 미만이면 공식 대신 값 그대로 (body 의 단위 규칙보다 우선하도록 body 에 직접) */
    document.body.style.setProperty('--pad-y', state.unit === 'mid' && state.y < 8 ? `${state.y}px` : '');
    document.body.style.setProperty('--pad-x', state.unit === 'mid' && state.x < 8 ? `${state.x}px` : '');

    $$('#padToggle button').forEach(b => b.classList.toggle('is-on', b.dataset.unit === state.unit));
    [['#padYVal', state.y], ['#padXVal', state.x]].forEach(([id, v]) => {
      if (document.activeElement !== $(id)) $(id).value = v;
    });
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    readout();
  }

  $('#padToggle').addEventListener('click', e => {
    const b = e.target.closest('button[data-unit]'); if (b) { state.unit = b.dataset.unit; apply(); }
  });
  /* 입력 중에는 유효한 값일 때만 반영하고, 범위 보정은 blur 에서 */
  [['#padYVal', 'y', 0, 300], ['#padXVal', 'x', 0, 300]].forEach(([id, k, lo, hi]) => {
    $(id).addEventListener('input', e => { const n = Number(e.target.value); if (e.target.value !== '' && n >= lo && n <= hi) { state[k] = Math.round(n); apply(); } });
    $(id).addEventListener('blur', e => { state[k] = clampNum(e.target.value, lo, hi, state[k]); e.target.value = state[k]; apply(); });
  });
  $('#reset').addEventListener('click', () => { state = { ...DEF }; apply(); });

  $('#demoToggle').addEventListener('click', () => {
    const min = $('#demoNav').classList.toggle('is-min');
    $('#demoToggle').textContent = min ? '+' : '–';
    try { localStorage.setItem(UI_KEY, min ? 'min' : 'open'); } catch (e) {}
  });
  try {
    if (localStorage.getItem(UI_KEY) === 'min') { $('#demoNav').classList.add('is-min'); $('#demoToggle').textContent = '+'; }
  } catch (e) {}

  const f = n => n.toFixed(2);
  const box = s => $(s).getBoundingClientRect();
  function readout() {
    const cs = getComputedStyle($('.banner'));
    const py = parseFloat(cs.paddingTop), px = parseFloat(cs.paddingLeft);
    $('#padYCalc').textContent = `${state.unit}-${state.y} → ${f(py)}px`;
    $('#padXCalc').textContent = `${state.unit}-${state.x} → ${f(px)}px`;
    const title = parseFloat(getComputedStyle($('.banner__title')).fontSize);
    const lines = Math.round(box('.banner__title').height / (title * 1.3));
    const banner = box('.banner');
    $('#readout').innerHTML =
      `viewport <b>${innerWidth}</b> · 섹션 <b>${f(banner.width)}</b> × <b>${f(banner.height)}</b><br>` +
      `상하 <b>${f(py)}</b> · 좌우 <b>${f(px)}</b> · 버튼 하단 ↔ 섹션 하단 <b>${f(banner.bottom - box('.banner__buttons').bottom)}</b><br>` +
      `H2 <b>${f(title)}</b> (${lines}줄) · P2 <b>${f(parseFloat(getComputedStyle($('.banner__desc')).fontSize))}</b> · 텍스트 폭 <b>${f(box('.banner__text').width)}</b>`;
  }
  addEventListener('resize', readout);

  apply();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(readout);
})();
</script>
</body>
</html>
